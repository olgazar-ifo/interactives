<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Інтерактиви</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
    --accent: #0f766e; --accent-soft: #e6f4f2; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c; --card: #1b222a; --text: #e5e7eb; --muted: #9ca3af;
      --accent: #5eead4; --accent-soft: #1f3a37; --border: #2b343e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .search {
    width: 100%; padding: 10px 14px; margin-bottom: 20px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 1rem;
  }
  .list { display: grid; gap: 12px; }
  a.item {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    text-decoration: none; color: inherit;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  a.item:hover, a.item:focus-visible {
    transform: translateY(-2px); border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(0,0,0,.08); outline: none;
  }
  .icon {
    flex: none; width: 42px; height: 42px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-weight: 700; font-size: .8rem;
  }
  .name { font-weight: 600; font-size: 1.05rem; }
  .file { color: var(--muted); font-size: .85rem; }
  .arrow { margin-left: auto; color: var(--accent); font-size: 1.3rem; }
  .msg { color: var(--muted); padding: 20px 0; text-align: center; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Інтерактиви</h1>
  <p class="sub">Оберіть інтерактивну вправу або тренажер</p>
  <input class="search" id="search" type="search" placeholder="Пошук за назвою…" aria-label="Пошук">
  <div class="list" id="list"><div class="msg">Завантаження списку…</div></div>
  <footer id="foot"></footer>
</div>

<script>
// ---- Налаштування ----
const OWNER = "olgazar-ifo";
const REPO  = "interactives";

// Гарні назви для файлів (необов'язково). Ключ — ім'я файлу.
const TITLES = {
  "DefDB.html":    "DefDB",
  "bigdata9.html": "Великі дані (9 клас)"
};

// Запасний список, якщо GitHub API недоступний
const FALLBACK = ["DefDB.html", "bigdata9.html"];

// Файли, які не показуємо
const HIDDEN = ["index.html"];
// ----------------------

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
let items = [];

function prettify(file) {
  return TITLES[file] || file.replace(/\.html?$/i, "").replace(/[-_]+/g, " ");
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const shown = items.filter(f =>
    prettify(f).toLowerCase().includes(q) || f.toLowerCase().includes(q));
  if (!shown.length) {
    listEl.innerHTML = '<div class="msg">Нічого не знайдено</div>';
    return;
  }
  listEl.innerHTML = "";
  shown.forEach(f => {
    const a = document.createElement("a");
    a.className = "item";
    a.href = encodeURI(f);
    a.innerHTML =
      '<div class="icon">HTML</div>' +
      '<div><div class="name"></div><div class="file"></div></div>' +
      '<div class="arrow">→</div>';
    a.querySelector(".name").textContent = prettify(f);
    a.querySelector(".file").textContent = f;
    listEl.appendChild(a);
  });
}

function setItems(files) {
  items = files
    .filter(f => /\.html?$/i.test(f) && !HIDDEN.includes(f))
    .sort((a, b) => prettify(a).localeCompare(prettify(b), "uk"));
  render();
}

async function load() {
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    setItems(data.filter(x => x.type === "file").map(x => x.name));
  } catch (e) {
    setItems(FALLBACK);
    document.getElementById("foot").textContent =
      "Показано збережений список файлів.";
  }
}

searchEl.addEventListener("input", render);
load();
</script>
</body>
</html>
