<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#9aa3b8;--ac:#8fa6ff;--acs:#262e52;--ok:#6fdca0;--oks:#16352a;--wa:#ffc766;--was:#3a2e12;--bd:#2d3550}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#9aa3b8;--ac:#8fa6ff;--acs:#262e52;--ok:#6fdca0;--oks:#16352a;--wa:#ffc766;--was:#3a2e12;--bd:#2d3550}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2em 0}.sub{color:var(--mu);margin:0 0 14px;font-size:.95rem}
.dots{display:flex;gap:8px;margin:12px 0}
.dot{flex:1;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;cursor:pointer}
.dot.cur{border-color:var(--ac);color:var(--ac);font-weight:700}.dot.done{background:var(--oks);color:var(--ok);border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:8px}
.tag{display:inline-block;background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600}
.sit{background:var(--bg);border-left:4px solid var(--ac);padding:10px 14px;border-radius:8px;margin:12px 0}
.q{font-weight:700;margin:14px 0 8px}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;cursor:pointer}
label.o.sel{border-color:var(--ac);background:var(--acs)}
textarea{width:100%;min-height:110px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
button.b{background:var(--ac);color:var(--bg);border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.b:disabled{opacity:.5;cursor:not-allowed}
.cnt{color:var(--mu);font-size:.85rem}
.fb{margin-top:16px;border-top:1px dashed var(--bd);padding-top:14px}
.box{border-radius:12px;padding:10px 14px;margin:10px 0}
.box.ok{background:var(--oks)}.box.wa{background:var(--was)}.box.in{background:var(--acs)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border-radius:99px;padding:3px 11px;font-size:.88rem}
.chip.y{background:var(--oks);color:var(--ok)}.chip.n{background:var(--was);color:var(--wa)}
.my{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0 0}
ul{padding-left:20px;margin:6px 0}
</style>
</head>

<div class="dots" id="dots"></div>
<div id="main"></div>
</div>

{ic:"📍",n:"Геотеги та безпека",
